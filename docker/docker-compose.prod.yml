# Production Docker Compose Configuration

services:
  # Ollama LLM Service
  ollama:
    image: ollama/ollama:latest
    container_name: inpt-ollama-prod
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_MODELS=/root/.ollama/models
      - OLLAMA_NUM_PARALLEL=4
      - OLLAMA_MAX_LOADED_MODELS=2
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # RAG Application
  rag-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        - BUILD_ENV=production
    container_name: inpt-rag-app-prod
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ../data:/app/data
      - ../database:/app/database
      - ../logs:/app/logs
      - app_cache:/app/.cache
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:3b}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-paraphrase-multilingual-MiniLM-L12-v2}
      - CHUNK_SIZE=${CHUNK_SIZE:-1000}
      - CHUNK_OVERLAP=${CHUNK_OVERLAP:-200}
      - TOP_K_RETRIEVAL=${TOP_K_RETRIEVAL:-7}
      - SIMILARITY_THRESHOLD=${SIMILARITY_THRESHOLD:-0.4}
      - RERANK_TOP_K=${RERANK_TOP_K:-3}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.1}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-500}
      - SEMANTIC_WEIGHT=${SEMANTIC_WEIGHT:-0.7}
      - BM25_WEIGHT=${BM25_WEIGHT:-0.3}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_MAX_UPLOAD_SIZE=200
      - STREAMLIT_SERVER_ENABLE_CORS=false
      - STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION=true
    depends_on:
      ollama:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Public HTTPS reverse proxy with basic auth
  caddy:
    image: caddy:2-alpine
    container_name: inpt-caddy-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - APP_DOMAIN=${APP_DOMAIN:?Set APP_DOMAIN in your production environment}
      - ACME_EMAIL=${ACME_EMAIL:?Set ACME_EMAIL in your production environment}
      - BASIC_AUTH_USER=${BASIC_AUTH_USER:?Set BASIC_AUTH_USER in your production environment}
      - BASIC_AUTH_HASH=${BASIC_AUTH_HASH:?Set BASIC_AUTH_HASH in your production environment}
    depends_on:
      rag-app:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  ollama_data:
    driver: local
  app_cache:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  default:
    name: inpt-rag-network
    driver: bridge
