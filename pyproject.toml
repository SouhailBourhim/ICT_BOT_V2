[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inpt-rag-assistant"
version = "0.1.0"
description = "Assistant Éducatif RAG pour Smart ICT - INPT"
authors = [
    {name = "INPT Team", email = "contact@inpt.ac.ma"}
]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["rag", "llm", "education", "ollama", "chromadb"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "streamlit>=1.28.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pypdf>=3.17.0",
    "python-docx>=1.1.0",
    "markdown>=3.5.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "spacy>=3.7.0",
    "langdetect>=1.0.9",
    "torch==2.2.2",
    "sentence-transformers>=2.7.0,<3.0.0",
    "langchain>=0.2.17,<0.3.0",
    "langchain-community>=0.2.19,<0.3.0",
    "langchain-text-splitters>=0.2.4,<0.3.0",
    "langchain-experimental>=0.0.65,<0.1.0",
    "chromadb>=0.4.0",
    "faiss-cpu>=1.7.4",
    "rank-bm25>=0.2.2",
    "ollama>=0.1.6",
    "nltk>=3.8.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "plotly>=5.18.0",
    "pandas>=2.1.0",
    "tqdm>=4.66.0",
    "loguru>=0.7.0",
    "requests>=2.31.0",
    "prometheus-client>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "flake8>=6.1.0",
    "mypy>=1.7.0",
]

[tool.setuptools.packages.find]
include = ["src*", "app*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
